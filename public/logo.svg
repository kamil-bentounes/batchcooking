<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img"
     aria-label="Popote">
  <!--
    La marque : une cocotte, couvercle posé.

    Deux contraintes ont tout décidé. Elle doit tenir à 16 px dans un onglet —
    donc une SILHOUETTE PLEINE, pas un contour : un trait de deux pixels
    disparaît, une masse non. Et elle doit appartenir à l'application — donc le
    vert de structure, et le safran, qui est le seul accent du produit et ne
    sert ici qu'au bouton du couvercle.

    Le couvercle déborde franchement de chaque côté : c'est cette ligne
    horizontale, plus que le corps, qui fait reconnaître une cocotte une fois
    la forme réduite à quelques pixels. Le jeu entre le couvercle et le corps
    est VOLONTAIRE et large — à un demi-pixel il passerait pour un défaut.

    Les anses sont dessinées avant le corps et rentrent dessous : sinon leur
    jointure se voit, la paroi étant oblique.
  -->
  <g fill="#2F5D45">
    <!-- Les anses, glissées sous le corps. -->
    <rect x="3"  y="34" width="15" height="7" rx="3.5" />
    <rect x="46" y="34" width="15" height="7" rx="3.5" />
    <!-- Le corps, plus étroit en bas, fond largement arrondi. -->
    <path d="M10 29.5h44l-3.1 18.6A8 8 0 0 1 43 54.8H21a8 8 0 0 1-7.9-6.7z" />
    <!-- Le couvercle : la ligne qui porte toute la reconnaissance. -->
    <rect x="5" y="19.5" width="54" height="8" rx="4" />
  </g>
  <!-- Le bouton, posé dessus. L'unique touche de safran de l'application. -->
  <path fill="#E8A33D" d="M25 19.5a7 7 0 0 1 14 0z" />
</svg>
