# Le réveil quotidien de la base.
#
# Le projet Supabase est sur l'offre gratuite : sans activité pendant sept
# jours, il se met en PAUSE, et l'application en ligne meurt pour tout le monde
# — ni connexion, ni création de compte. Le 19/10/2026, on l'a trouvé ainsi :
# `status: INACTIVE`, et chaque requête finissait en « connection timeout ».
# Une invitée qui ouvre son lien après une semaine de vacances du foyer ne
# pouvait donc pas entrer, quoi que fasse le code.
#
# Une requête par jour suffit à le garder éveillé. Elle passe par la clé
# PUBLIQUE de `.env.production` (celle que sert déjà le site) et par la
# fonction `invitation_par_jeton`, ouverte à `anon` : un vrai `select`, sur un
# jeton qui n'existe pas, qui ne rend rien.
#
# Si elle échoue, GitHub envoie un mail : c'est l'alarme « l'appli est tombée ».
name: Réveil de la base

on:
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  reveil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .env.production
          sparse-checkout-cone-mode: false

      - name: Une requête à la base
        run: |
          set -euo pipefail
          URL=$(grep '^VITE_SUPABASE_URL=' .env.production | cut -d= -f2-)
          CLE=$(grep '^VITE_SUPABASE_ANON_KEY=' .env.production | cut -d= -f2-)
          code=$(curl -s -o reponse.json -w '%{http_code}' --max-time 60 \
            -X POST "$URL/rest/v1/rpc/invitation_par_jeton" \
            -H "apikey: $CLE" -H 'Content-Type: application/json' \
            -d '{"jeton":"00000000-0000-0000-0000-000000000000"}')
          echo "HTTP $code : $(cat reponse.json)"
          test "$code" = 200

      # GitHub désactive un cron après soixante jours sans commit sur le dépôt.
      # Le réactiver à chaque passage remet ce compte à zéro : sans cela, le
      # réveil s'endormirait lui aussi, en silence.
      - name: Le réveil ne s'endort pas lui-même
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/reveil.yml/enable"
