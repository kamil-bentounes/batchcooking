<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2F5D45" />
    <!-- L'onglet. Le SVG d'abord — il reste net à toutes les densités — et le
         PNG pour les systèmes qui n'en veulent pas (iOS, notamment).

         %BASE_URL% et pas `/` : le site est servi sous un sous-chemin sur
         GitHub Pages. Un chemin absolu y pointait à la racine du domaine, donc
         sur une 404 — l'onglet restait vierge en production et net en local,
         ce qui est la façon la plus sûre de ne jamais voir le bug. -->
    <link rel="icon" type="image/svg+xml" href="%BASE_URL%logo.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="%BASE_URL%icone-192.png" />
    <link rel="apple-touch-icon" href="%BASE_URL%icone-192.png" />
    <meta name="description"
          content="Ce qu’on mange et ce que ça coûte, à deux." />
    <title>Popote</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:SOFT,WONK,opsz,wght@0..100,0..1,9..144,400..800&family=Instrument+Sans:wght@400..700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
