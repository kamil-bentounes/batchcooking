<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ton code de confirmation</title></head>
<body style="margin:0;background:#F2F4EF;font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;color:#1C2B23">
<div style="max-width:480px;margin:0 auto;padding:32px 20px">
<p style="font-size:20px;font-weight:700;margin:0 0 20px;color:#2F5D45">Popote</p>
<div style="background:#FBFCFA;border-radius:16px;padding:28px 24px">
<h1 style="font-size:20px;line-height:1.3;margin:0 0 14px">Ton code de confirmation</h1>
<p style="font-size:16px;line-height:1.5;margin:0">Saisis ce code dans Popote pour confirmer que c’est bien toi. Il expire au bout d’une heure.</p>
<p style="font-size:32px;letter-spacing:6px;font-weight:700;margin:24px 0;color:#1C2B23">{{ .Token }}</p>
</div>
<p style="font-size:12px;line-height:1.5;color:#5D6E62;margin:18px 4px 0">Si tu n’es pas à l’origine de cette demande, ignore ce message : rien ne change.</p>
</div></body></html>
